
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to diff against (only used when cargo_deny_check=auto)"
        type: string
        default: master
      cargo_deny_check:
        description: "Run or skip the `cargo deny` step"
        type: choice
        options:
          - auto
          - force-run
          - force-skip
        default: auto

name: Check, Lint, Build

env:
  CARGO_TERM_COLOR: always
  ELECTRS_VERSION: v3.2.0
  BITCOIND_UNPATCHED_VERSION: "30.2"

jobs:
  check-lint:
    name: Check, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Install pinned Rust toolchain
        # Channel and components come from rust-toolchain.toml, which is the
        # single source of truth for the Rust version.
        run: rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-all-crates: "true"
          shared-key: debug-x86_64-unknown-linux-gnu

      - name: Rustfmt
        run: cargo fmt -- --check
      
      - name: Cargo check
        run: cargo check --all-targets --all-features
      
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      
      - name: Check changed files
        id: changed-files
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'auto')
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cargo_lock:
              - 'Cargo.lock'
            deny_toml:
              - 'deny.toml'

      - name: Deny
        if: >-
          (github.event_name == 'pull_request' && (steps.changed-files.outputs.cargo_lock == 'true' || steps.changed-files.outputs.deny_toml == 'true')) ||
          (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'force-run') ||
          (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'auto' && (steps.changed-files.outputs.cargo_lock == 'true' || steps.changed-files.outputs.deny_toml == 'true'))
        uses: EmbarkStudios/cargo-deny-action@v2

  cache-electrs:
    name: Build electrs if not cached
    runs-on: ubuntu-latest
    steps:
      - name: Check cache
        id: check-cache
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}

      - name: Build electrs
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch ${{ env.ELECTRS_VERSION }} --depth 1 https://github.com/mempool/electrs.git ${{ runner.temp }}/electrs
          pushd ${{ runner.temp }}/electrs
          cargo build --locked --release
          popd

      - name: Save cache
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}


  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [cache-electrs, check-lint]
    steps:
      # The `-latest-` artifacts are republished in place, so there is no
      # version to key a cache on. Key on the server's ETag instead: a hit means
      # the build is byte-identical, and a new release invalidates the cache by
      # itself. Falls back to a per-run key so a failed HEAD downloads fresh.
      - name: Resolve dependency cache keys
        id: dep-keys
        run: |
          etag() {
            curl -fsSLI "$1" \
              | tr -d '\r' \
              | awk 'tolower($1) == "etag:" { gsub(/"/, "", $2); print $2 }' \
              | tail -1
          }
          for dep in patched:"$BITCOIN_PATCHED_URL" enforcer:"$ENFORCER_URL"; do
            name="${dep%%:*}"
            tag="$(etag "${dep#*:}" || true)"
            if [ -z "$tag" ]; then
              tag="unknown-${{ github.run_id }}-${{ github.run_attempt }}"
              echo "::warning::Could not read ETag for $name; skipping its cache"
            fi
            echo "$name=$tag" >> "$GITHUB_OUTPUT"
          done
        env:
          BITCOIN_PATCHED_URL: https://releases.drivechain.info/L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          ENFORCER_URL: https://releases.drivechain.info/bip300301-enforcer-latest-x86_64-unknown-linux-gnu.zip

      - name: Cache bitcoin-patched
        id: cache-bitcoin-patched
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/deps/bitcoin-patched
          key: bitcoin-patched-x86_64-linux-${{ steps.dep-keys.outputs.patched }}

      - name: Download bitcoin-patched
        if: steps.cache-bitcoin-patched.outputs.cache-hit != 'true'
        run: |
          cd "${{ runner.temp }}"
          wget -q https://releases.drivechain.info/L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          unzip -q L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          rm L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          mkdir -p deps
          rm -rf deps/bitcoin-patched
          mv L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu deps/bitcoin-patched
          chmod +x deps/bitcoin-patched/bitcoind deps/bitcoin-patched/bitcoin-cli

      - name: Cache bitcoin unpatched
        id: cache-bitcoin-unpatched
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/deps/bitcoin-unpatched
          key: bitcoin-unpatched-x86_64-linux-${{ env.BITCOIND_UNPATCHED_VERSION }}

      - name: Download bitcoin unpatched
        if: steps.cache-bitcoin-unpatched.outputs.cache-hit != 'true'
        run: |
          cd "${{ runner.temp }}"
          VERSION='${{ env.BITCOIND_UNPATCHED_VERSION }}'
          TARBALL="bitcoin-${VERSION}-x86_64-linux-gnu.tar.gz"
          wget -q "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/${TARBALL}"
          tar -xf "${TARBALL}"
          rm "${TARBALL}"
          mkdir -p deps
          rm -rf deps/bitcoin-unpatched
          mv "bitcoin-${VERSION}/bin" deps/bitcoin-unpatched
          rm -r "bitcoin-${VERSION}"

      - name: Cache bip300301_enforcer
        id: cache-enforcer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/deps/bip300301-enforcer
          key: bip300301-enforcer-x86_64-linux-${{ steps.dep-keys.outputs.enforcer }}

      - name: Download bip300301_enforcer
        if: steps.cache-enforcer.outputs.cache-hit != 'true'
        run: |
          cd "${{ runner.temp }}"
          wget -q https://releases.drivechain.info/bip300301-enforcer-latest-x86_64-unknown-linux-gnu.zip
          unzip -q bip300301-enforcer-latest-x86_64-unknown-linux-gnu.zip
          rm bip300301-enforcer-latest-x86_64-unknown-linux-gnu.zip
          mkdir -p deps
          rm -f deps/bip300301-enforcer
          mv bip300301-enforcer-latest-x86_64-unknown-linux-gnu/bip300301-enforcer-*-x86_64-unknown-linux-gnu deps/bip300301-enforcer
          rm -r bip300301-enforcer-latest-x86_64-unknown-linux-gnu
          chmod +x deps/bip300301-enforcer

      - name: Restore electrs from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}

      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Install pinned Rust toolchain
        # Channel comes from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-all-crates: "true"
          shared-key: debug-x86_64-unknown-linux-gnu

      - name: Build (debug)
        run: cargo build --bin thunder_app --example integration_tests

      - name: Run integration tests
        id: runIntegrationTests
        run: |
          export BIP300301_ENFORCER='${{ runner.temp }}/deps/bip300301-enforcer'
          export BITCOIND='${{ runner.temp }}/deps/bitcoin-patched/bitcoind'
          export BITCOIND_UNPATCHED='${{ runner.temp }}/deps/bitcoin-unpatched/bitcoind'
          export BITCOIN_CLI='${{ runner.temp }}/deps/bitcoin-patched/bitcoin-cli'
          export ELECTRS='${{ runner.temp }}/electrs/target/release/electrs'
          export THUNDER_APP='target/debug/thunder_app'
          target/debug/examples/integration_tests

  test-build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary-suffix: ""
            rustflags: ""
          - os: macos-latest-large
            name: x86_64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: macos-latest
            name: aarch64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: ubuntu-latest
            name: x86_64-pc-windows-gnu
            binary-suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"
    name: Test, Build, Release ((${{ matrix.name }}))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Install windows-specific deps
        run: sudo apt install mingw-w64
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}

      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Install pinned Rust toolchain
        # Channel comes from rust-toolchain.toml; the cross-compilation
        # target comes from the build matrix.
        run: |
          rustup toolchain install
          rustup target add '${{ matrix.name }}'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-all-crates: "true"
          shared-key: ${{ matrix.name }}

      - name: Test
        run: cargo test --tests

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: 'Set environment variables: version number and output filenames'
        run: |
          THUNDER_APP_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "thunder_app") | .version) | .[0]')
          THUNDER_APP_FILENAME="thunder-${THUNDER_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          THUNDER_CLI_FILENAME="thunder-cli-${THUNDER_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          echo "THUNDER_APP_VERSION=$THUNDER_APP_VERSION" >> "$GITHUB_ENV"
          echo "THUNDER_APP_FILENAME=$THUNDER_APP_FILENAME" >> "$GITHUB_ENV"
          echo "THUNDER_CLI_FILENAME=$THUNDER_CLI_FILENAME" >> "$GITHUB_ENV"

      - name: 'Set filenames for release binaries'
        run: |
          pushd "target/${{ matrix.name }}/release/"
          ln -fs "thunder_app${{ matrix.binary-suffix }}" "${THUNDER_APP_FILENAME}"
          ln -fs "thunder_app_cli${{ matrix.binary-suffix }}" "${THUNDER_CLI_FILENAME}"
          popd

      - name: 'Upload Artifacts (thunder)'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.THUNDER_APP_FILENAME }}
          if-no-files-found: error
          path: |
            target/${{ matrix.name }}/release/${{ env.THUNDER_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.THUNDER_CLI_FILENAME }}

      - name: Extract Git tag name
        id: git-tag-name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "git_tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Parse Git tag name as semver
        uses: madhead/semver-utils@v5.0.0
        if: startsWith(github.ref, 'refs/tags/')
        id: parse-git-tag-name-semver
        with:
          version: ${{ steps.git-tag-name.outputs.git_tag_name }}

      - name: Release
        uses: softprops/action-gh-release@v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.name }}/release/${{ env.THUNDER_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.THUNDER_CLI_FILENAME }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.parse-git-tag-name-semver.outputs.prerelease != '' }}

  parse-semver:
    name: Parse version info
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      prerelease: ${{ steps.parse-git-tag-name-semver.outputs.prerelease }}
    steps:
      - name: Extract Git tag name
        id: git-tag-name
        run: |
          echo "git_tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Parse Git tag name as semver
        uses: madhead/semver-utils@v5.0.0
        id: parse-git-tag-name-semver
        with:
          version: ${{ steps.git-tag-name.outputs.git_tag_name }}

  upload-releases-to-releases-drivechain-info:
    name: Upload releases to releases.drivechain.info
    runs-on: ubuntu-latest
    needs: [integration-test, test-build-release, parse-semver]
    if: startsWith(github.ref, 'refs/tags/') && needs.parse-semver.outputs.prerelease == ''
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          fileName: '*'
          tag: ${{ github.ref_name }}

      - name: Create zip files for releases.drivechain.info
        run: |
          shopt -s extglob
          mv thunder-+([0-9]).+([0-9]).+([0-9])-x86_64-apple-darwin thunder-latest-x86_64-apple-darwin
          mv thunder-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-apple-darwin thunder-cli-latest-x86_64-apple-darwin
          zip L2-S9-Thunder-latest-x86_64-apple-darwin.zip \
            thunder-latest-x86_64-apple-darwin \
            thunder-cli-latest-x86_64-apple-darwin
          mv thunder-+([0-9]).+([0-9]).+([0-9])-aarch64-apple-darwin thunder-latest-aarch64-apple-darwin
          mv thunder-cli-+([0-9]).+([0-9]).+([0-9])-aarch64-apple-darwin thunder-cli-latest-aarch64-apple-darwin
          zip L2-S9-Thunder-latest-aarch64-apple-darwin.zip \
            thunder-latest-aarch64-apple-darwin \
            thunder-cli-latest-aarch64-apple-darwin
          mv thunder-+([0-9]).+([0-9]).+([0-9])-x86_64-pc-windows-gnu.exe thunder-latest-x86_64-pc-windows-gnu.exe
          mv thunder-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-pc-windows-gnu.exe thunder-cli-latest-x86_64-pc-windows-gnu.exe
          zip L2-S9-Thunder-latest-x86_64-pc-windows-gnu.zip \
            thunder-latest-x86_64-pc-windows-gnu.exe \
            thunder-cli-latest-x86_64-pc-windows-gnu.exe
          mv thunder-+([0-9]).+([0-9]).+([0-9])-x86_64-unknown-linux-gnu thunder-latest-x86_64-unknown-linux-gnu
          mv thunder-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-unknown-linux-gnu thunder-cli-latest-x86_64-unknown-linux-gnu
          zip L2-S9-Thunder-latest-x86_64-unknown-linux-gnu.zip \
            thunder-latest-x86_64-unknown-linux-gnu \
            thunder-cli-latest-x86_64-unknown-linux-gnu

      - name: Upload release assets to releases.drivechain.info
        uses: appleboy/scp-action@v1
        with:
          host: 45.33.96.47
          username: root
          password: ${{ secrets.RELEASES_SERVER_PW }}
          port: 22
          source: 'L2-S9-Thunder-latest-*.zip'
          target: '/var/www/html/'
